# One-command app + MariaDB stack:
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d --build
# This overrides the custody service to use MySQL and adds a MariaDB service.
services:
  custody:
    environment:
      - DB_CLIENT=mysql
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=kryvon
      - MYSQL_PASSWORD=kryvonpw
      - MYSQL_DATABASE=kryvon
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    container_name: usdt-custody-db
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=kryvon
      - MARIADB_USER=kryvon
      - MARIADB_PASSWORD=kryvonpw
      - MARIADB_ROOT_PASSWORD=change-me-root
    volumes:
      - custody-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  custody-mysql:
